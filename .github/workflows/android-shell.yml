
name: Build Android Shell APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "要加载的自部署站点地址（https://…）"
        required: false
        type: string
  push:
    branches: [main]
    paths: ["android-shell/**", ".github/workflows/android-shell.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHELL_SIGNING_PASSWORD: ${{ secrets.SHELL_SIGNING_PASSWORD }}
      SHELL_SITE_URL: ${{ inputs.site_url || vars.SHELL_SITE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Create or restore persistent signing key
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SHELL_SIGNING_PASSWORD:-}" ]; then
            echo "::error::Missing SHELL_SIGNING_PASSWORD secret"
            exit 1
          fi

          mkdir -p release-signing

          if [ -f release-signing/shell.keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in release-signing/shell.keystore.enc \
              -out /tmp/shell.keystore \
              -pass env:SHELL_SIGNING_PASSWORD
          else
            keytool -genkeypair -noprompt -v \
              -keystore /tmp/shell.keystore \
              -storetype JKS \
              -storepass "$SHELL_SIGNING_PASSWORD" \
              -keypass "$SHELL_SIGNING_PASSWORD" \
              -alias floatshell \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=FloatShell, OU=Android, O=Personal, L=Unknown, ST=Unknown, C=US"

            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -in /tmp/shell.keystore \
              -out release-signing/shell.keystore.enc \
              -pass env:SHELL_SIGNING_PASSWORD

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add release-signing/shell.keystore.enc
            git commit -m "chore: store encrypted Android signing key"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          {
            echo "SHELL_KEYSTORE_FILE=/tmp/shell.keystore"
            echo "SHELL_KEYSTORE_PASSWORD=$SHELL_SIGNING_PASSWORD"
            echo "SHELL_KEY_ALIAS=floatshell"
            echo "SHELL_KEY_PASSWORD=$SHELL_SIGNING_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Use Float website launcher icon
        run: cp public/icon-512.png android-shell/app/src/main/res/drawable/appicon.png

      - name: Build APKs
        run: gradle -p android-shell assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-debug
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-release
          path: android-shell/app/build/outputs/apk/release/*.apk
